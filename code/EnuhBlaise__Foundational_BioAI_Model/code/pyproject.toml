[project]
name = "bio-foundation-repo"
version = "0.1.0"
description = "Modular single-cell transcriptomics foundation-model research repository"
requires-python = ">=3.10"

[project.optional-dependencies]
census = ["cellxgene-census>=1.15", "tiledbsoma>=1.11"]
dev = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]

[tool.setuptools.packages.find]
include = ["src*"]
