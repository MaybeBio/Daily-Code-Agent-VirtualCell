[build-system]
requires = ["setuptools==65.5.0", "wheel==0.38.4"]
build-backend = "setuptools.build_meta"

[project]
name = "immuneworld"
version = "1.0.0"
requires-python = "==3.10.*"
dependencies = ["torch==1.13.1", "numpy==1.23.5", "scipy==1.9.3", "scanpy==1.9.1", "scvelo==0.2.5", "anndata==0.8.0", "pandas==1.5.2", "scikit-learn==1.1.3", "omegaconf==2.3.0", "h5py==3.7.0"]

[project.scripts]
immuneworld-train = "immuneworld.commands.train:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
